<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAKEROBOT PRO Controller</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none;
            user-select: none;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* WATERMARK LOGO */
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35vw; 
            pointer-events: none; 
            z-index: -1; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .center-logo img {
            max-width: 100%;
            height: auto;
            opacity: 0.15; 
        }

        .controller-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }

        /* Top Bar UI */
        #top-bar {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        #readout {
            color: #2ecc71;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
        }

        #btn-connect {
            pointer-events: auto;
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #d35400;
        }

        #btn-connect:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #d35400;
        }

        /* Button Clusters */
        .button-cluster {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
        }

        .btn {
            background-color: #3455db;
            border-radius: 50%;
            border: 2px solid #2c3e50;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 0px #1c2833;
        }
        
        .btn:active, .btn.active {
            background-color: #2980b9;
            box-shadow: 0px 0px 0px #1c2833;
            transform: translateY(4px);
        }

        .btn-top { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-bottom { grid-column: 2; grid-row: 3; }

        /* Joysticks */
        .joystick-base {
            width: 150px;
            height: 150px;
            background-color: #333;
            border-radius: 50%;
            position: relative;
            border: 2px solid #555;
        }
        
        .joystick-stick {
            width: 60px;
            height: 60px;
            background-color: #e74c3c;
            border-radius: 50%;
            position: absolute;
            top: 45px;
            left: 45px;
            box-shadow: inset 0px 0px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <!-- Top UI Bar -->
    <div id="top-bar">
        <div id="readout">SYSTEM READY</div>
        <button id="btn-connect">CONNECT BLUETOOTH</button>
    </div>

    <!-- WATERMARK CENTER LOGO -->
    <div class="center-logo">
        <img src="icon.png" alt="">
    </div>

    <!-- LEFT SIDE: D-Pad & Left Stick -->
    <div class="controller-half">
        <div class="button-cluster">
            <div class="btn btn-top" id="btn-up">UP</div>
            <div class="btn btn-left" id="btn-left">LT</div>
            <div class="btn btn-right" id="btn-right">RT</div>
            <div class="btn btn-bottom" id="btn-down">DN</div>
        </div>
        <div class="joystick-base" id="joy-left">
            <div class="joystick-stick" id="stick-left"></div>
        </div>
    </div>

    <!-- RIGHT SIDE: ABXY & Right Stick -->
    <div class="controller-half">
        <div class="button-cluster">
            <div class="btn btn-top" id="btn-y">Y</div>
            <div class="btn btn-left" id="btn-x">X</div>
            <div class="btn btn-right" id="btn-b">B</div>
            <div class="btn btn-bottom" id="btn-a">A</div>
        </div>
        <div class="joystick-base" id="joy-right">
            <div class="joystick-stick" id="stick-right"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // WEB BLUETOOTH API
        // ==========================================
        let bleDevice;
        let bleServer;
        let uartService;
        let rxCharacteristic; // Renamed to RX (Receive) for clarity

        // Nordic UART Service UUIDs
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        // The micro:bit's RX characteristic (Phone writes TO this) ends in 0003!
        const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        const connectBtn = document.getElementById('btn-connect');
        const readout = document.getElementById('readout');

        connectBtn.addEventListener('click', async () => {
            try {
                readout.innerText = "SCANNING...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                readout.innerText = "CONNECTING...";
                bleServer = await bleDevice.gatt.connect();
                uartService = await bleServer.getPrimaryService(UART_SERVICE_UUID);
                
                // Get the correct WRITE characteristic (0003)
                rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                readout.innerText = "CONNECTED!";
                connectBtn.innerText = "CONNECTED";
                connectBtn.style.backgroundColor = "#2ecc71";
                connectBtn.style.boxShadow = "0px 4px 0px #27ae60";

            } catch (error) {
                console.error('Bluetooth Error:', error);
                readout.innerText = "CONNECTION FAILED";
            }
        });

        function onDisconnected() {
            readout.innerText = "DISCONNECTED";
            connectBtn.innerText = "CONNECT BLUETOOTH";
            connectBtn.style.backgroundColor = "#e74c3c";
            connectBtn.style.boxShadow = "0px 4px 0px #c0392b";
            rxCharacteristic = null;
        }

        // UPGRADED SEND FUNCTION (Using "#" Delimiter & correct RX characteristic)
        async function sendCommand(cmd) {
            console.log("SENDING:", cmd);
            readout.innerText = "CMD: " + cmd;

            if (!rxCharacteristic) return; 

            try {
                // Add the hashtag (#) so MakeCode knows the message is finished!
                let encoder = new TextEncoder();
                let data = encoder.encode(cmd + "#");
                
                // Write without response prevents the browser from queue-locking
                if (rxCharacteristic.properties.writeWithoutResponse) {
                    await rxCharacteristic.writeValueWithoutResponse(data);
                } else {
                    await rxCharacteristic.writeValue(data);
                }
            } catch (error) {
                console.error('Send Error:', error);
                readout.innerText = "SEND ERROR";
            }
        }

        // ==========================================
        // CONTROLLER LOGIC
        // ==========================================
        const btnCodes = {
            'btn-up': 'U', 'btn-down': 'D', 'btn-left': 'L', 'btn-right': 'R',
            'btn-y': 'Y', 'btn-a': 'A', 'btn-x': 'X', 'btn-b': 'B'
        };

        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btn.classList.add('active');
                sendCommand(btnCodes[btn.id] + "1");
            }, {passive: false});

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                sendCommand(btnCodes[btn.id] + "0");
            }, {passive: false});
            
            btn.addEventListener('touchcancel', (e) => {
                btn.classList.remove('active');
                sendCommand(btnCodes[btn.id] + "0");
            });
        });

        // Combined logic for tank/mecanum control
        let leftDir = "N";
        let rightDir = "N";
        let currentMoveCmd = "M_N"; 

        function updateMovement() {
            let newMoveCmd = "M_N"; 

            if (leftDir === "U" && rightDir === "N") newMoveCmd = "M_U";
            else if (leftDir === "D" && rightDir === "N") newMoveCmd = "M_D";
            else if (leftDir === "N" && rightDir === "L") newMoveCmd = "M_L";
            else if (leftDir === "N" && rightDir === "R") newMoveCmd = "M_R";
            else if (leftDir === "U" && rightDir === "L") newMoveCmd = "M_UL";
            else if (leftDir === "U" && rightDir === "R") newMoveCmd = "M_UR";
            else if (leftDir === "D" && rightDir === "L") newMoveCmd = "M_DL";
            else if (leftDir === "D" && rightDir === "R") newMoveCmd = "M_DR";

            if (newMoveCmd !== currentMoveCmd) {
                currentMoveCmd = newMoveCmd;
                sendCommand(currentMoveCmd);
            }
        }

        // 8-Way Thumbstick Sensing
        function setupJoystick(baseId, stickId, side) {
            const base = document.getElementById(baseId);
            const stick = document.getElementById(stickId);
            const maxRadius = 45; 
            const deadzone = 15;  

            let activeTouchId = null;

            function resetStick() {
                stick.style.transform = `translate(0px, 0px)`;
                activeTouchId = null;
                
                if (side === 'L') leftDir = "N";
                if (side === 'R') rightDir = "N";
                updateMovement();
            }

            function handleTouch(e) {
                e.preventDefault();
                
                let touch = null;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.type === 'touchstart' && activeTouchId === null) {
                        activeTouchId = e.changedTouches[i].identifier;
                    }
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }
                if (!touch) return;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    resetStick();
                    return;
                }

                const rect = base.getBoundingClientRect();
                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);
                
                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;

                let distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                let angleRad = Math.atan2(deltaY, deltaX);
                let angleDeg = angleRad * (180 / Math.PI);

                if (distance > maxRadius) {
                    deltaX = Math.cos(angleRad) * maxRadius;
                    deltaY = Math.sin(angleRad) * maxRadius;
                }

                stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

                let newDir = "N";
                if (distance > deadzone) {
                    if (angleDeg > -22.5 && angleDeg <= 22.5) newDir = "R";
                    else if (angleDeg > 22.5 && angleDeg <= 67.5) newDir = "DR";
                    else if (angleDeg > 67.5 && angleDeg <= 112.5) newDir = "D";
                    else if (angleDeg > 112.5 && angleDeg <= 157.5) newDir = "DL";
                    else if (angleDeg > 157.5 || angleDeg <= -157.5) newDir = "L";
                    else if (angleDeg > -157.5 && angleDeg <= -112.5) newDir = "UL";
                    else if (angleDeg > -112.5 && angleDeg <= -67.5) newDir = "U";
                    else if (angleDeg > -67.5 && angleDeg <= -22.5) newDir = "UR";
                }

                if (side === 'L' && leftDir !== newDir) {
                    leftDir = newDir;
                    updateMovement();
                } else if (side === 'R' && rightDir !== newDir) {
                    rightDir = newDir;
                    updateMovement();
                }
            }

            base.addEventListener('touchstart', handleTouch, {passive: false});
            base.addEventListener('touchmove', handleTouch, {passive: false});
            base.addEventListener('touchend', handleTouch, {passive: false});
            base.addEventListener('touchcancel', handleTouch, {passive: false});
        }

        setupJoystick('joy-left', 'stick-left', 'L');
        setupJoystick('joy-right', 'stick-right', 'R');

    </script>
</body>
</html>
