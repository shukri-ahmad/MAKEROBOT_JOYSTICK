<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / FULLSCREEN META TAGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212" id="meta-theme-color">

    <title>MAKEROBOT PRO Controller</title>
    <style>
        /* ==========================================
           BASE STYLES (DARK THEME DEFAULT)
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            background-image: radial-gradient(circle at 50% 50%, #1e1e1e 0%, #0a0a0a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
            user-select: none;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative; 
            transition: all 0.3s ease;
        }

        /* PORTRAIT WARNING OVERLAY */
        #portrait-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e74c3c;
            color: white;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex; }
            .app-container { display: none !important; }
        }

        /* 3-COLUMN LAYOUT */
        .app-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            position: relative;
        }

        /* FLOATING HELP BUTTON */
        .btn-help {
            position: absolute;
            top: 15px;
            right: max(20px, env(safe-area-inset-right));
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, #333, #222);
            color: #ccc;
            border: 1px solid #444;
            border-top: 1px solid #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #111, 0px 4px 10px rgba(0,0,0,0.5);
            transition: all 0.1s;
            z-index: 1000;
        }
        .btn-help:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #111, 0px 2px 5px rgba(0,0,0,0.5);
            background: linear-gradient(145deg, #222, #111);
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            height: 100%;
            min-width: 160px; 
            position: relative;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 95%;
            background-color: #181818;
            border-radius: 20px;
            padding: 15px;
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #2a2a2a;
            max-width: 300px;
            transition: all 0.3s ease;
        }

        /* ROBOT SELECTOR TOGGLE */
        .robot-selector {
            display: flex;
            background: #050505;
            border-radius: 20px;
            padding: 4px;
            border: 1px solid #222;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
