<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAKEROBOT Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #121212; color: white; font-family: sans-serif; touch-action: none; overflow: hidden; height: 100vh; width: 100vw; }
        
        #portrait-warning { display: none; position: fixed; inset: 0; background: #e74c3c; z-index: 9999; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; text-align: center; }
        @media screen and (orientation: portrait) { #portrait-warning { display: flex; } .app { display: none !important; } }

        .app { display: flex; width: 100%; height: 100%; padding: 10px; }
        .side { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; }
        .center { flex: 1; max-width: 280px; background: #1e1e1e; border: 2px solid #333; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }

        #btn-connect { width: 100%; background: #e67e22; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        .logo-svg { width: 140px; height: auto; cursor: pointer; }
        .logo-svg:active { transform: scale(0.95); }

        .telemetry { width: 100%; background: #000; border: 1px solid #333; border-radius: 6px; padding: 6px; text-align: center; }
        .label { color: #888; font-size: 9px; text-transform: uppercase; margin-top: 2px; }
        .val { font-family: monospace; font-size: 14px; font-weight: bold; }
        #status-text { color: #e74c3c; }
        #readout { color: #2ecc71; }
        #telemetry-rx { color: #3498db; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 2px; }
        .btn { background: #3455db; border-radius: 50%; border: 2px solid #2c3e50; color: white; font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center; }
        .btn:active, .btn.active { background: #2980b9; transform: translateY(2px); }
        .b-top { grid-area: 1 / 2; } .b-left { grid-area: 2 / 1; } .b-right { grid-area: 2 / 3; } .b-bot { grid-area: 3 / 2; }

        .joy-base { width: 150px; height: 150px; background: #2a2a2a; border-radius: 50%; position: relative; border: 3px solid #444; }
        .joy-stick { width: 50px; height: 50px; background: #e74c3c; border-radius: 50%; position: absolute; top: 47px; left: 47px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="portrait-warning">🔄 Please rotate phone to Landscape</div>

    <div class="app">
        <div class="side">
            <div class="btn-grid">
                <div class="btn b-top" id="btn-up">UP</div>
                <div class="btn b-left" id="btn-left">LT</div>
                <div class="btn b-right" id="btn-right">RT</div>
                <div class="btn b-bot" id="btn-down">DN</div>
            </div>
            <div class="joy-base" id="joy-left"><div class="joy-stick" id="stick-left"></div></div>
        </div>

        <div class="center">
            <button id="btn-connect">CONNECT BLITZ</button>
            
            <svg class="logo-svg" id="logo-fullscreen" viewBox="0 0 200 50">
                <rect width="200" height="50" rx="8" fill="#2c3e50"/>
                <text x="100" y="32" fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">MAKEROBOT</text>
            </svg>

            <div class="telemetry">
                <div class="label">Status</div>
                <div class="val" id="status-text">OFFLINE</div>
                <div class="label">Sent Cmd</div>
                <div class="val" id="readout">M_N</div>
                <div class="label">BLITZ DATA</div>
                <div class="val" id="telemetry-rx">WAITING...</div>
            </div>
        </div>

        <div class="side">
            <div class="btn-grid">
                <div class="btn b-top" id="btn-y">Y</div>
                <div class="btn b-left" id="btn-x">X</div>
                <div class="btn b-right" id="btn-b">B</div>
                <div class="btn b-bot" id="btn-a">A</div>
            </div>
            <div class="joy-base" id="joy-right"><div class="joy-stick" id="stick-right"></div></div>
        </div>
    </div>

    <script>
        // FULLSCREEN VIA LOGO TAP
        document.getElementById('logo-fullscreen').addEventListener('click', () => {
            let d = document.documentElement;
            if (!document.fullscreenElement) {
                (d.requestFullscreen || d.webkitRequestFullScreen || d.mozRequestFullScreen) .call(d);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
            }
        });

        // BLUETOOTH
        let bleDevice, bleServer, uartService, rxChar, txChar;
        const UUID_SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UUID_TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UUID_RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        const connectBtn = document.getElementById('btn-connect');
        const readout = document.getElementById('readout');
        const statusText = document.getElementById('status-text');
        const telemetryRx = document.getElementById('telemetry-rx');

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "SCANNING...";
                statusText.style.color = "#f39c12"; 
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UUID_SVC]
                });
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                statusText.innerText = "CONNECTING...";
                bleServer = await bleDevice.gatt.connect();
                uartService = await bleServer.getPrimaryService(UUID_SVC);
                rxChar = await uartService.getCharacteristic(UUID_RX);
                txChar = await uartService.getCharacteristic(UUID_TX);
                await txChar.startNotifications();
                txChar.addEventListener('characteristicvaluechanged', (e) => {
                    let str = new TextDecoder().decode(e.target.value).trim().replace("#", "");
                    telemetryRx.innerText = str;
                });
                statusText.innerText = "CONNECTED";
                statusText.style.color = "#2ecc71"; 
                telemetryRx.innerText = "READY";
                connectBtn.innerText = "DISCONNECT";
                connectBtn.style.background = "#27ae60";
            } catch (err) {
                statusText.innerText = "FAILED";
                statusText.style.color = "#e74c3c";
            }
        });

        function onDisconnected() {
            statusText.innerText = "OFFLINE";
            statusText.style.color = "#e74c3c"; 
            telemetryRx.innerText = "WAITING...";
            connectBtn.innerText = "CONNECT BLITZ";
            connectBtn.style.background = "#e67e22";
            rxChar = null; txChar = null;
        }

        async function sendCommand(cmd) {
            readout.innerText = cmd;
            if (!rxChar) return;
            try {
                let data = new TextEncoder().encode(cmd + "#");
                if (rxChar.properties.writeWithoutResponse) {
                    await rxChar.writeValueWithoutResponse(data);
                } else {
                    await rxChar.writeValue(data);
                }
            } catch (e) { console.error(e); }
        }

        // BUTTONS
        const btnCodes = {
            'btn-up': 'DIR_U', 'btn-down': 'DIR_D', 'btn-left': 'DIR_L', 'btn-right': 'DIR_R',
            'btn-y': 'ACT_Y', 'btn-a': 'ACT_A', 'btn-x': 'ACT_X', 'btn-b': 'ACT_B'
        };
        const buttonStates = {};
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!buttonStates[btn.id]) {
                    buttonStates[btn.id] = true;
                    btn.classList.add('active');
                    sendCommand(btnCodes[btn.id] + "_ON");
                }
            }, {passive: false});
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (buttonStates[btn.id]) {
                    buttonStates[btn.id] = false;
                    btn.classList.remove('active');
                    sendCommand(btnCodes[btn.id] + "_OFF");
                }
            }, {passive: false});
        });

        // JOYSTICKS
        let leftDir = "N", rightDir = "N", currentMoveCmd = "M_N";
        function updateMovement() {
            let n = "M_N";
            if (leftDir === "U" && rightDir === "N") n = "M_U";
            else if (leftDir === "D" && rightDir === "N") n = "M_D";
            else if (leftDir === "N" && rightDir === "L") n = "M_L";
            else if (leftDir === "N" && rightDir === "R") n = "M_R";
            else if (leftDir === "U" && rightDir === "L") n = "M_UL";
            else if (leftDir === "U" && rightDir === "R") n = "M_UR";
            else if (leftDir === "D" && rightDir === "L") n = "M_DL";
            else if (leftDir === "D" && rightDir === "R") n = "M_DR";
            if (n !== currentMoveCmd) { currentMoveCmd = n; sendCommand(currentMoveCmd); }
        }

        function setupJoystick(baseId, stickId, side) {
            const base = document.getElementById(baseId);
            const stick = document.getElementById(stickId);
            let activeTouchId = null;

            function handleTouch(e) {
                e.preventDefault();
                let touch = null;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.type === 'touchstart' && activeTouchId === null) activeTouchId = e.changedTouches[i].identifier;
                    if (e.changedTouches[i].identifier === activeTouchId) { touch = e.changedTouches[i]; break; }
                }
                if (!touch) return;
                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    stick.style.transform = `translate(0px, 0px)`;
                    activeTouchId = null;
                    if (side === 'L') leftDir = "N"; if (side === 'R') rightDir = "N";
                    updateMovement();
                    return;
                }
                const rect = base.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy);
                let rad = Math.atan2(dy, dx);
                let deg = rad * (180 / Math.PI);

                if (dist > 45) { dx = Math.cos(rad) * 45; dy = Math.sin(rad) * 45; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;

                let newDir = "N";
                if (dist > 15) {
                    if (deg > -22.5 && deg <= 22.5) newDir = "R";
                    else if (deg > 22.5 && deg <= 67.5) newDir = "DR";
                    else if (deg > 67.5 && deg <= 112.5) newDir = "D";
                    else if (deg > 112.5 && deg <= 157.5) newDir = "DL";
                    else if (deg > 157.5 || deg <= -157.5) newDir = "L";
                    else if (deg > -157.5 && deg <= -112.5) newDir = "UL";
                    else if (deg > -112.5 && deg <= -67.5) newDir = "U";
                    else if (deg > -67.5 && deg <= -22.5) newDir = "UR";
                }

                if (side === 'L' && leftDir !== newDir) { leftDir = newDir; updateMovement(); }
                else if (side === 'R' && rightDir !== newDir) { rightDir = newDir; updateMovement(); }
            }

            base.addEventListener('touchstart', handleTouch, {passive: false});
            base.addEventListener('touchmove',
