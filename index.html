<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / FULLSCREEN META TAGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212" id="meta-theme-color">

    <title>MAKEROBOT PRO Controller</title>
    <style>
        /* ==========================================
           BASE STYLES (DARK THEME DEFAULT)
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            background-image: radial-gradient(circle at 50% 50%, #1e1e1e 0%, #0a0a0a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
            user-select: none;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative; 
            transition: all 0.3s ease;
        }

        /* PORTRAIT WARNING OVERLAY */
        #portrait-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e74c3c;
            color: white;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex; }
            .app-container { display: none !important; }
        }

        /* 3-COLUMN LAYOUT */
        .app-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            height: 100%;
            min-width: 160px; 
            position: relative;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 95%;
            background-color: #181818;
            border-radius: 20px;
            padding: 15px;
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #2a2a2a;
            max-width: 300px;
            transition: all 0.3s ease;
        }

        /* ROBOT SELECTOR TOGGLE */
        .robot-selector {
            display: flex;
            background: #050505;
            border-radius: 20px;
            padding: 4px;
            border: 1px solid #222;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: linear-gradient(145deg, #3a3a3a, #222);
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        /* CENTER PANEL UI */
        #btn-connect {
            width: 100%;
            background: linear-gradient(145deg, #333, #222);
            color: #ddd;
            border: 1px solid #444;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #111;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s;
        }
        #btn-connect:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #111;
            background: linear-gradient(145deg, #222, #111);
        }

        /* XBOX-STYLE HOME BUTTON (LOGO) */
        .main-logo {
            width: 90px;
            height: 90px;
            padding: 12px; 
            box-sizing: border-box;
            background: radial-gradient(circle at 35% 35%, #4a4a4a, #0a0a0a);
            border: 3px solid #888;
            border-radius: 50%;
            object-fit: contain;
            box-shadow: 0 8px 15px rgba(0,0,0,0.9), 
                        inset 0 -4px 10px rgba(0,0,0,0.6), 
                        inset 0 3px 5px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .main-logo:active {
            transform: scale(0.92);
            border-color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.9), inset 0 6px 12px rgba(0,0,0,0.9);
        }

        .telemetry-box {
            width: 100%;
            background-color: #050505;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,1);
            transition: all 0.3s ease;
        }

        .telemetry-label {
            color: #666;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        #readout, #status-text, #telemetry-rx {
            color: #2ecc71;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
        #status-text { color: #e74c3c; font-size: 12px; }
        #telemetry-rx { color: #3498db; }

        /* BUTTON CLUSTERS */
        .button-cluster {
            display: grid;
            grid-template-columns: 50px 50px 50px; 
            grid-template-rows: 50px 50px 50px;
            gap: 4px; 
            transition: all 0.3s ease;
        }

        /* COMMON BUTTON POSITIONING */
        .btn-top { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-bottom { grid-column: 2; grid-row: 3; }

        /* D-PAD STYLING */
        .btn-dpad {
            background: linear-gradient(145deg, #3a3a3a, #222);
            border-radius: 8px;
            border: 1px solid #1a1a1a;
            color: #888;
            font-size: 18px; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 0px #0a0a0a, inset 0 2px 2px rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn-dpad:active, .btn-dpad.active {
            background: #222;
            box-shadow: 0px 0px 0px #0a0a0a, inset 0 4px 8px rgba(0,0,0,0.8);
            transform: translateY(4px);
            color: #fff;
        }

        /* ENLARGED D-PAD FOR TRACER MODE */
        .large-dpad {
            grid-template-columns: 75px 75px 75px !important;
            grid-template-rows: 75px 75px 75px !important;
            gap: 6px !important;
        }
        .large-dpad .btn-dpad { font-size: 26px; border-radius: 12px; }

        /* ACTION BUTTON STYLING */
        .btn-action {
            background: linear-gradient(145deg, #333, #1a1a1a);
            border-radius: 50%;
            border: 1px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 5px 0px #050505, inset 0 2px 4px rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .btn-action:active, .btn-action.active {
            background: #1a1a1a;
            box-shadow: 0px 0px 0px #050505, inset 0 4px 8px rgba(0,0,0,0.8);
            transform: translateY(5px);
        }

        #btn-tri { color: #10eb71; font-size: 20px; } 
        #btn-cir { color: #f2355b; font-size: 22px; } 
        #btn-cross { color: #5976eb; font-size: 20px; } 
        #btn-sq { color: #df55a3; font-size: 24px; } 

        /* JOYSTICKS */
        .joystick-base {
            width: 160px; height: 160px;
            background-color: #151515;
            border-radius: 50%; position: relative;
            border: 2px solid #2a2a2a;
            box-shadow: inset 0px 0px 25px rgba(0,0,0,0.9), 0 5px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }
        .joystick-stick {
            width: 60px; height: 60px;
            background: radial-gradient(circle at center, #444 30%, #1a1a1a 90%);
            border-radius: 50%; position: absolute;
            top: 50px; left: 50px;
            border: 2px solid #111;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.6), inset 0px 2px 5px rgba(255,255,255,0.15);
            pointer-events: none; transition: transform 0.05s linear;
        }
        .joystick-stick::after {
            content: ''; position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border-radius: 50%; border: 2px solid #222;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* TERMINAL (RIGHT SIDE - TRACER MODE ONLY) */
        .terminal-container {
            display: none; 
            flex-direction: column;
            width: 90%;
            height: 85%;
            background: #111;
            border-radius: 12px;
            border: 2px solid #333;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: inset 0px 0px 10px rgba(0,0,0,0.8);
        }
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            text-transform: uppercase;
        }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #2ecc71;
            text-align: left;
            word-wrap: break-word;
        }
        .terminal-line { margin: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px;}
        .terminal-time { color: #888; font-size: 10px; margin-right: 5px; }
        
        .btn-clear {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 0 #c0392b;
        }
        .btn-clear:active { transform: translateY(2px); box-shadow: 0 0 0 #c0392b; }

        /* ==========================================
           TRACER LIGHT THEME OVERRIDES
           ========================================== */
        body.tracer-theme {
            background-image: radial-gradient(circle at 50% 50%, #ffffff 0%, #dcdcdc 100%);
            color: #121212;
        }
        body.tracer-theme .center-panel {
            background-color: #f5f5f5;
            border-color: #ddd;
            box-shadow: inset 0px 0px 15px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.1);
        }
        body.tracer-theme .telemetry-box {
            background-color: #fff;
            border-color: #ccc;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        body.tracer-theme .telemetry-label { color: #999; }
        body.tracer-theme .robot-selector { background: #e0e0e0; border-color: #d0d0d0; }
        body.tracer-theme .mode-btn { color: #888; }
        body.tracer-theme .mode-btn.active {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            color: #111; border-color: #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        body.tracer-theme #btn-connect {
            background: linear-gradient(145deg, #eee, #ddd);
            color: #333; border-color: #ccc; box-shadow: 0px 4px 0px #bbb;
        }
        body.tracer-theme #btn-connect:active {
            background: linear-gradient(145deg, #ddd, #ccc); box-shadow: 0px 0px 0px #bbb;
        }
        body.tracer-theme .main-logo {
            background: radial-gradient(circle at 35% 35%, #ffffff, #c0c0c0);
            border-color: #aaa; box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 -4px 10px rgba(0,0,0,0.1);
        }
        body.tracer-theme .btn-dpad {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-color: #ccc; color: #555;
            box-shadow: 0px 5px 0px #bbb, inset 0 2px 2px rgba(255,255,255,1);
        }
        body.tracer-theme .btn-dpad:active, body.tracer-theme .btn-dpad.active {
            background: #e6e6e6; color: #111;
            box-shadow: 0px 0px 0px #bbb, inset 0 4px 8px rgba(0,0,0,0.1);
        }
        body.tracer-theme .terminal-container { background: #fff; border-color: #ccc; box-shadow: inset 0px 0px 10px rgba(0,0,0,0.05); }
        body.tracer-theme .terminal-output { color: #27ae60; }
        body.tracer-theme .terminal-line { border-bottom: 1px solid #eee; }
        body.tracer-theme .terminal-time { color: #aaa; }
    </style>
</head>
<body>

    <div id="portrait-warning">
        <div>🔄</div>
        <div>Please rotate your phone to Landscape mode</div>
    </div>

    <div class="app-container">
        
        <!-- LEFT SIDE (D-PAD & Left Joystick) -->
        <div class="side-panel">
            <div class="button-cluster" id="left-dpad-cluster">
                <div class="btn btn-dpad btn-top" id="btn-up">▲</div>
                <div class="btn btn-dpad btn-left" id="btn-left">◀</div>
                <div class="btn btn-dpad btn-right" id="btn-right">▶</div>
                <div class="btn btn-dpad btn-bottom" id="btn-down">▼</div>
            </div>
            <div class="joystick-base" id="joy-left">
                <div class="joystick-stick" id="stick-left"></div>
            </div>
        </div>

        <!-- CENTER SIDE -->
        <div class="center-panel">
            <div class="robot-selector">
                <div class="mode-btn active" id="mode-blitz">BLITZ</div>
                <div class="mode-btn" id="mode-tracer">TRACER</div>
            </div>

            <button id="btn-connect">Connect BLITZ</button>
            
            <img src="icon.png" alt="MAKEROBOT Logo" class="main-logo" id="logo-fullscreen">
            
            <div class="telemetry-box">
                <div class="telemetry-label">Status</div>
                <div id="status-text">OFFLINE</div>
                <div class="telemetry-label" style="margin-top: 2px;">Sent Cmd</div>
                <div id="readout">M_N</div>
                <div class="telemetry-label" style="margin-top: 2px;" id="rx-label">BLITZ DATA</div>
                <div id="telemetry-rx">WAITING...</div>
            </div>
        </div>

        <!-- RIGHT SIDE (ACTION BUTTONS, Right Joystick & Terminal) -->
        <div class="side-panel">
            
            <!-- BLITZ UI -->
            <div class="button-cluster" id="right-action-cluster">
                <div class="btn btn-action btn-top" id="btn-tri">▲</div>
                <div class="btn btn-action btn-left" id="btn-sq">■</div>
                <div class="btn btn-action btn-right" id="btn-cir">●</div>
                <div class="btn btn-action btn-bottom" id="btn-cross">✖</div>
            </div>
            <div class="joystick-base" id="joy-right">
                <div class="joystick-stick" id="stick-right"></div>
            </div>

            <!-- TRACER UI (TERMINAL) -->
            <div class="terminal-container" id="terminal-container">
                <div class="terminal-header">
                    <span>Input History</span>
                    <button class="btn-clear" id="btn-clear">CLEAR</button>
                </div>
                <div class="terminal-output" id="terminal-output">
                    <!-- Logs go here -->
                </div>
            </div>

        </div>
        
    </div>

    <script>
        // ==========================================
        // ROBOT MODE SELECTOR LOGIC & THEME ENGINE
        // ==========================================
        const modeBlitz = document.getElementById('mode-blitz');
        const modeTracer = document.getElementById('mode-tracer');
        
        const joyLeft = document.getElementById('joy-left');
        const joyRight = document.getElementById('joy-right');
        const leftDpadCluster = document.getElementById('left-dpad-cluster');
        const rightActionCluster = document.getElementById('right-action-cluster');
        const terminalContainer = document.getElementById('terminal-container');
        
        const connectBtn = document.getElementById('btn-connect');
        const rxLabel = document.getElementById('rx-label');
        const metaThemeColor = document.getElementById('meta-theme-color');
        
        let currentRobot = 'BLITZ';

        function setRobotMode(mode) {
            currentRobot = mode;
            if (mode === 'BLITZ') {
                modeBlitz.classList.add('active');
                modeTracer.classList.remove('active');
                document.body.classList.remove('tracer-theme');
                metaThemeColor.setAttribute('content', '#121212');
                
                leftDpadCluster.classList.remove('large-dpad');

                joyLeft.style.display = 'block';
                joyRight.style.display = 'block';
                rightActionCluster.style.display = 'grid';
                terminalContainer.style.display = 'none'; 
                
                rxLabel.innerText = 'BLITZ DATA';
                if(document.getElementById('status-text').innerText !== "CONNECTED") {
                    connectBtn.innerText = 'Connect BLITZ';
                }
            } else {
                modeTracer.classList.add('active');
                modeBlitz.classList.remove('active');
                document.body.classList.add('tracer-theme'); 
                metaThemeColor.setAttribute('content', '#ffffff');
                
                leftDpadCluster.classList.add('large-dpad');

                joyLeft.style.display = 'none';
                joyRight.style.display = 'none';
                rightActionCluster.style.display = 'none';
                terminalContainer.style.display = 'flex'; 
                
                rxLabel.innerText = 'TRACER DATA';
                if(document.getElementById('status-text').innerText !== "CONNECTED") {
                    connectBtn.innerText = 'Connect TRACER';
                }
            }
        }

        modeBlitz.addEventListener('click', () => setRobotMode('BLITZ'));
        modeTracer.addEventListener('click', () => setRobotMode('TRACER'));

        // ==========================================
        // TERMINAL LOGIC
        // ==========================================
        const terminalOutput = document.getElementById('terminal-output');
        const btnClear = document.getElementById('btn-clear');

        function logToTerminal(msg) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0') + ':' + 
                            now.getSeconds().toString().padStart(2, '0');
                            
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerHTML = `<span class="terminal-time">[${timeStr}]</span> > ${msg}`;
            
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        btnClear.addEventListener('click', () => {
            terminalOutput.innerHTML = '';
        });

        // ==========================================
        // FULLSCREEN TOGGLE VIA LOGO
        // ==========================================
        const logoFullscreen = document.getElementById('logo-fullscreen');
        logoFullscreen.addEventListener('click', () => {
            let docElm = document.documentElement;
            let isFullscreen = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFullscreen) {
                if (docElm.requestFullscreen) { docElm.requestFullscreen(); } 
                else if (docElm.mozRequestFullScreen) { docElm.mozRequestFullScreen(); } 
                else if (docElm.webkitRequestFullScreen) { docElm.webkitRequestFullScreen(); } 
                else if (docElm.msRequestFullscreen) { docElm.msRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } 
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
            }
        });

        // ==========================================
        // WEB BLUETOOTH API (BIDIRECTIONAL)
        // ==========================================
        let bleDevice;
        let bleServer;
        let uartService;
        let rxCharacteristic; 
        let txCharacteristic; 

        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        const readout = document.getElementById('readout');
        const statusText = document.getElementById('status-text');
        const telemetryRx = document.getElementById('telemetry-rx');

        connectBtn.addEventListener('click', async () => {
            if (rxCharacteristic) return;

            try {
                statusText.innerText = "SCANNING...";
                statusText.style.color = "#f39c12"; 
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusText.innerText = "CONNECTING...";
                bleServer = await bleDevice.gatt.connect();
                uartService = await bleServer.getPrimaryService(UART_SERVICE_UUID);
                
                rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
                txCharacteristic = await uartService.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingTelemetry);

                statusText.innerText = "CONNECTED";
                statusText.style.color = "#2ecc71"; 
                telemetryRx.innerText = "READY";
                
                connectBtn.innerText = "DISCONNECT";
                connectBtn.style.background = "linear-gradient(145deg, #27ae60, #1e8449)";
                connectBtn.style.borderColor = "#1e8449";
                connectBtn.style.boxShadow = "0px 4px 0px #145a32";

            } catch (error) {
                console.error('Bluetooth Error:', error);
                statusText.innerText = "FAILED";
                statusText.style.color = "#e74c3c";
            }
        });

        function handleIncomingTelemetry(event) {
            let value = event.target.value;
            let decoder = new TextDecoder('utf-8');
            let receivedString = decoder.decode(value).trim();
            receivedString = receivedString.replace("#", "");
            telemetryRx.innerText = receivedString;
            // Cleaned terminal: We deliberately ignore raw RX logs here.
        }

        function onDisconnected() {
            statusText.innerText = "OFFLINE";
            statusText.style.color = "#e74c3c"; 
            telemetryRx.innerText = "WAITING...";
            
            connectBtn.innerText = `Connect ${currentRobot}`;
            
            if(currentRobot === 'TRACER') {
                connectBtn.style.background = "linear-gradient(145deg, #eee, #ddd)";
                connectBtn.style.borderColor = "#ccc";
                connectBtn.style.boxShadow = "0px 4px 0px #bbb";
            } else {
                connectBtn.style.background = "linear-gradient(145deg, #333, #222)";
                connectBtn.style.borderColor = "#444";
                connectBtn.style.boxShadow = "0px 4px 0px #111";
            }
            
            rxCharacteristic = null;
            txCharacteristic = null;
        }

        async function sendCommand(cmd) {
            readout.innerText = cmd;
            
            // Cleaned terminal: We deliberately ignore raw TX logs here too.

            if (!rxCharacteristic) return; 

            try {
                let encoder = new TextEncoder();
                let data = encoder.encode(cmd + "#");
                
                if (rxCharacteristic.properties.writeWithoutResponse) {
                    await rxCharacteristic.writeValueWithoutResponse(data);
                } else {
                    await rxCharacteristic.writeValue(data);
                }
            } catch (error) {
                console.error('Send Error:', error);
            }
        }

        // ==========================================
        // CONTROLLER LOGIC & MAPPING
        // ==========================================
        const btnCodes = {
            'btn-up': 'up', 'btn-down': 'down', 'btn-left': 'left', 'btn-right': 'right',
            'btn-tri': 'tri', 'btn-cross': 'cross', 'btn-sq': 'sq', 'btn-cir': 'cir'
        };

        // NEW: Throttle lock for TRACER terminal 0.5s requirement
        let tracerDelayLock = false;

        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                
                // If in TRACER mode, enforce 0.5 sec delay between button presses
                if (currentRobot === 'TRACER' && tracerDelayLock) {
                    return; // Ignore the press completely if the lock is active
                }
                
                btn.classList.add('active');
                
                let baseCmd = btnCodes[btn.id];
                sendCommand(baseCmd + "1");

                // Execute TRACER specific Logging and 0.5s Throttle
                if (currentRobot === 'TRACER') {
                    // Only log human readable Direction
                    logToTerminal(`PRESSED: ${baseCmd.toUpperCase()}`);
                    
                    tracerDelayLock = true;
                    setTimeout(() => {
                        tracerDelayLock = false;
                    }, 500); // 0.5 sec delay
                }
                
            }, {passive: false});

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                
                // Only fire the release command if the button was actually active 
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    sendCommand(btnCodes[btn.id] + "0");
                }
            }, {passive: false});
            
            btn.addEventListener('touchcancel', (e) => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    sendCommand(btnCodes[btn.id] + "0");
                }
            });
        });

        let leftDir = "N";
        let rightDir = "N";
        let currentMoveCmd = "M_N"; 

        function updateMovement() {
            let newMoveCmd = "M_N"; 

            if (leftDir === "U" && rightDir === "N") newMoveCmd = "M_U";
            else if (leftDir === "D" && rightDir === "N") newMoveCmd = "M_D";
            else if (leftDir === "N" && rightDir === "L") newMoveCmd = "M_L";
            else if (leftDir === "N" && rightDir === "R") newMoveCmd = "M_R";
            else if (leftDir === "U" && rightDir === "L") newMoveCmd = "M_UL";
            else if (leftDir === "U" && rightDir === "R") newMoveCmd = "M_UR";
            else if (leftDir === "D" && rightDir === "L") newMoveCmd = "M_DL";
            else if (leftDir === "D" && rightDir === "R") newMoveCmd = "M_DR";

            if (newMoveCmd !== currentMoveCmd) {
                currentMoveCmd = newMoveCmd;
                sendCommand(currentMoveCmd);
            }
        }

        function setupJoystick(baseId, stickId, side) {
            const base = document.getElementById(baseId);
            const stick = document.getElementById(stickId);
            
            const maxRadius = 50; 
            const deadzone = 15;  

            let activeTouchId = null;

            function resetStick() {
                stick.style.transform = `translate(0px, 0px)`;
                activeTouchId = null;
                
                if (side === 'L') leftDir = "N";
                if (side === 'R') rightDir = "N";
                updateMovement();
            }

            function handleTouch(e) {
                e.preventDefault();
                
                let touch = null;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.type === 'touchstart' && activeTouchId === null) {
                        activeTouchId = e.changedTouches[i].identifier;
                    }
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }
                if (!touch) return;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    resetStick();
                    return;
                }

                const rect = base.getBoundingClientRect();
                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);
                
                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;

                let distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                let angleRad = Math.atan2(deltaY, deltaX);
                let angleDeg = angleRad * (180 / Math.PI);

                if (distance > maxRadius) {
                    deltaX = Math.cos(angleRad) * maxRadius;
                    deltaY = Math.sin(angleRad) * maxRadius;
                }

                stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

                let newDir = "N";
                if (distance > deadzone) {
                    if (angleDeg > -22.5 && angleDeg <= 22.5) newDir = "R";
                    else if (angleDeg > 22.5 && angleDeg <= 67.5) newDir = "DR";
                    else if (angleDeg > 67.5 && angleDeg <= 112.5) newDir = "D";
                    else if (angleDeg > 112.5 && angleDeg <= 157.5) newDir = "DL";
                    else if (angleDeg > 157.5 || angleDeg <= -157.5) newDir = "L";
                    else if (angleDeg > -157.5 && angleDeg <= -112.5) newDir = "UL";
                    else if (angleDeg > -112.5 && angleDeg <= -67.5) newDir = "U";
                    else if (angleDeg > -67.5 && angleDeg <= -22.5) newDir = "UR";
                }

                if (side === 'L' && leftDir !== newDir) {
                    leftDir = newDir;
                    updateMovement();
                } else if (side === 'R' && rightDir !== newDir) {
                    rightDir = newDir;
                    updateMovement();
                }
            }

            base.addEventListener('touchstart', handleTouch, {passive: false});
            base.addEventListener('touchmove', handleTouch, {passive: false});
            base.addEventListener('touchend', handleTouch, {passive: false});
            base.addEventListener('touchcancel', handleTouch, {passive: false});
        }

        setupJoystick('joy-left', 'stick-left', 'L');
        setupJoystick('joy-right', 'stick-right', 'R');

    </script>
</body>
</html>
